name: ci
on:
  push: ~
  pull_request: ~
jobs:
  ci:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    name: Python ${{ matrix.python-version }}${{ fromJSON('["", " (regex)"]')[matrix.regex == '1'] }}

    strategy:
      fail-fast: false
      matrix:
        # pypy-3.11 is excluded: a pypy-3.11 interpreter bug segfaults when an
        # AttributeError subclass with an uninitialized `name` is raised from
        # __getattr__ (babelfish's LanguageConvertError, hit via str(Language)).
        # Not a guessit bug; fine on pypy-3.10 and all CPython.
        # Upstream: https://github.com/pypy/pypy/issues/5514
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14", "pypy-3.10" ]
        regex: [ "0", "1" ]
        exclude:
          # regex module doesn't play well with pypy and unicode.
          - python-version: "pypy-3.10"
            regex: "1"
          # test regex module only with Python 3.11.
          - python-version: "3.10"
            regex: "1"
          - python-version: "3.12"
            regex: "1"
          - python-version: "3.13"
            regex: "1"
          - python-version: "3.14"
            regex: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Dependencies
        run: uv sync --locked --no-default-groups --group test --group lint ${{ matrix.regex == '1' && '--extra regex' || '' }}

      - name: Ruff
        # --no-sync: reuse the env synced above; `uv run` would otherwise re-sync
        # the default (dev) group and try to build dev-only native deps (e.g.
        # pydantic-core via python-semantic-release), which has no pypy wheel.
        run: uv run --no-sync ruff check guessit

      - name: Test
        run: uv run --no-sync pytest --cov=guessit
        env:
          REBULK_REGEX_ENABLED: ${{ matrix.regex }}

      - name: Codecov
        uses: codecov/codecov-action@v7

  commitlint:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: wagoid/commitlint-github-action@v6

  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    needs: [ ci ]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Git User config
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "github-actions"

      - name: Bump version
        run: uvx --from python-semantic-release semantic-release version --no-commit --no-tag --no-push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: guessit-python
          path: ./dist

  build-bin-linux:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    needs: [ ci ]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install Dependencies
        run: uv sync --locked

      - name: Git User config
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "github-actions"

      - name: Bump version
        run: uvx --from python-semantic-release semantic-release version --no-commit --no-tag --no-push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Binary
        run: uv run pyinstaller --dist ./dist guessit.spec

      - name: Check binary
        run: ./dist/guessit "Treme.1x03.Right.Place,.Wrong.Time.HDTV.XviD-NoTV.avi"

      - uses: actions/upload-artifact@v7
        with:
          name: guessit-bin-linux
          path: ./dist

  build-bin-windows:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    needs: [ ci ]

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install Dependencies
        run: uv sync --locked

      - name: Git User config
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "github-actions"

      - name: Bump version
        run: uvx --from python-semantic-release semantic-release version --no-commit --no-tag --no-push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Binary
        run: uv run pyinstaller --dist ./dist guessit.spec

      - name: Check binary
        run: ./dist/guessit "Treme.1x03.Right.Place,.Wrong.Time.HDTV.XviD-NoTV.avi"

      - uses: actions/upload-artifact@v7
        with:
          name: guessit-bin-windows
          path: ./dist

  build-bin-macos:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    needs: [ ci ]

    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install Dependencies
        run: uv sync --locked

      - name: Git User config
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "github-actions"

      - name: Bump version
        run: uvx --from python-semantic-release semantic-release version --no-commit --no-tag --no-push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Binary
        run: uv run pyinstaller --dist ./dist guessit.spec

      - name: Check binary
        run: ./dist/guessit "Treme.1x03.Right.Place,.Wrong.Time.HDTV.XviD-NoTV.avi"

      - uses: actions/upload-artifact@v7
        with:
          name: guessit-bin-macos
          path: ./dist

  release:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: [ commitlint, build, build-bin-linux, build-bin-windows, build-bin-macos ]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Copy artifacts to ./dist
        run: |
          mkdir -p ./dist
          mv artifacts/guessit-bin-linux/guessit ./dist/guessit-linux
          mv artifacts/guessit-bin-macos/guessit ./dist/guessit-macos
          mv artifacts/guessit-bin-windows/guessit.exe ./dist/guessit-windows.exe
          mv artifacts/guessit-python/* ./dist

      - name: Git User config
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "github-actions"

      - name: Bump version
        run: uvx --from python-semantic-release semantic-release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to pypi
        run: uv publish --token "${PYPI_TOKEN}" dist/*.tar.gz dist/*.whl
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

      - name: Publish release
        run: uvx --from python-semantic-release semantic-release publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge master to develop
        uses: robotology/gh-action-nightly-merge@v1.5.2
        with:
          stable_branch: 'master'
          development_branch: 'develop'
          allow_ff: true
          user_name: github-actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
