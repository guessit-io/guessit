# Local setup: `uv run pre-commit install` (installs both the pre-commit and the
# commit-msg hooks, thanks to default_install_hook_types below).
# CI runs the file hooks through pre-commit/action, and the commit-msg rule
# through `cz check` (see .github/workflows/ci.yml).
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^guessit/

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.16.4
    hooks:
      - id: commitizen
        stages: [commit-msg]
