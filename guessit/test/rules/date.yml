# Multiple input strings having same expected results can be chained.
# Use - marker to check inputs that should not match results.
? +09.03.08
? +09.03.2008
? +2008.03.09
: date: 2008-03-09

? +31.01.15
? +31.01.2015
? +2015.01.31
: date: 2015-01-31

# valid_year upper bound widened to 2035 (#646/#815): for this fully ambiguous
# 2-digit date both 15 and 31 are plausible years, and 2031 is now valid, so
# dateutil resolves it day-first (15 Jan 2031).
? +15.01.31
: date: 2031-01-15

# With custom advanced_config.year.max: 2030, 31 is no longer a plausible year,
# so 15.01.31 resolves as 2015-01-31 instead of 2031-01-15.
? +15.01.31
: options:
    advanced_config:
      year:
        max: 2030
  date: 2015-01-31

? +01.02.03
: date: 2003-02-01

? +01.02.03
: options: --date-year-first
  date: 2001-02-03

? +01.02.03
: options: --date-day-first
  date: 2003-02-01

? 1899
: -year: 1899

? 1900
: year: 1900

? 2035
: year: 2035

? 2036
: -year: 2036

# Near-future year configurable via advanced_config.year
? 2033.Future.Apocalypse.1080p.BluRay.x264.DTS-HD.MA.7.1
: options:
    type: movie
    advanced_config:
      year:
        max: 2027
  title: 2033 Future Apocalypse

# Historical year configurable via advanced_config.year
? Roundhay Garden Scene 1888
: options:
    advanced_config:
      year:
        min: 1880
  title: Roundhay Garden Scene
  year: 1888

? (1920)
: year: 1920

? 2012
: year: 2012

? 2011 2013 (2012) (2015)  # first marked year is guessed.
: title: "2011 2013"
  year: 2012

? 2012 2009 S01E02 2015  # If no year is marked, the second one is guessed.
: title: "2012"
  year: 2009
  episode_title: "2015"

? Something 2 mar 2013)
: title: Something
  date: 2013-03-02
  type: episode

# With the movie hint, a single-digit day and month joined by a dot read as a decimal number, not
# a date (#963): "Jackass.2.5.2007" is the 2.5 sequel from 2007. Padded dates stay dates.
? Something 2.5.2007
: options: -t movie
  title: Something 2.5
  year: 2007
  -date: 2007-05-02

? Something.02.05.2007
: options: -t movie
  title: Something
  date: 2007-05-02
  type: movie

# Without the hint the dotted pair stays ambiguous with an unpadded air date ("Show.2.5.2024"), so
# it stays a date like the padded, dash- and space-separated spellings.
? Something.2.5.2007
? Something 02.05.2007
? Something 2-5-2007
? Something 2 5 2007
: title: Something
  date: 2007-05-02
  type: episode
